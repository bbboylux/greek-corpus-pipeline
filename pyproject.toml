[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "greek-corpus-pipeline"
version = "3.1.0"
description = "Diagnosis, assisted correction, search and statistics for Ancient Greek treebanks in AGDT format."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Anonymous authors (withheld for double-blind review)" },
]
keywords = [
  "ancient greek", "treebank", "AGDT", "dependency parsing",
  "annotation error detection", "digital classics", "corpus linguistics",
]

dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=14.0",     # the parquet engine and the string columns of pandas
  "PyQt6>=6.5",
  "matplotlib>=3.8",   # every chart and the export of the figures at 300 dpi
]

[project.optional-dependencies]
# The two automatic annotation models. On first use the program downloads their
# model files (about 60 MB); the program works without them.
models = [
  "stanza>=1.10",
  "ufal.udpipe>=1.3.1.1",
]
# What the test suite needs. psutil and threadpoolctl serve the tests that
# observe child processes and the number of threads; without them those tests
# are skipped, not failed. hatchling builds the wheel that one test unpacks.
dev = [
  "pytest>=8.0",
  "psutil>=5.9",
  "threadpoolctl>=3.1",
  "hatchling>=1.18",
]
all = [
  "greek-corpus-pipeline[models,dev]",
]

# [project.urls] is left out on purpose: the project address is withheld for the
# duration of the double-blind review.

[project.scripts]
greek-corpus-cli = "greek_corpus_pipeline.cli:main"

# A wheel carries the library, the interface package (the command line shares its worker functions with the
# desktop application) and the data files. The desktop application is started from the folder of the project
# (`python app_qt.py`, `run.bat`); the documented installation is `pip install -e .`.
[tool.hatch.build.targets.wheel]
packages = ["src/greek_corpus_pipeline", "gui_qt"]

[tool.hatch.build.targets.wheel.force-include]
"data" = "greek_corpus_pipeline/data"
